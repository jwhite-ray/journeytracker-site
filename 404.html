<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JourneyTracker invite</title>
<style>
:root {
  --bg: #faf8f4;
  --surface: #ffffff;
  --ink: #2b2620;
  --ink-soft: #6b6257;
  --accent: #3d6b4f;
  --rule: #e5dfd5;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191713;
    --surface: #221f1a;
    --ink: #ece7de;
    --ink-soft: #a89e90;
    --accent: #8fbf9f;
    --rule: #37322a;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
main { padding: 2rem 1.5rem; max-width: 26rem; }
.brand {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 1.75rem;
}
.brand a { color: var(--ink); text-decoration: none; }
p.context { color: var(--ink-soft); margin-bottom: 1.25rem; }
.code {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: clamp(2rem, 9vw, 2.9rem);
  font-weight: 700;
  letter-spacing: 0.14em;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 0.6em 0.5em;
  margin-bottom: 1.5rem;
  word-break: break-all;
}
.hint { color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 2rem; }
.get a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 0.55rem 1.3rem;
}
.get a:hover { border-color: var(--accent); }
#notfound { display: none; }
#notfound a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="brand"><a href="/">W Jamm</a></div>

  <div id="invite">
    <p class="context">A friend invited you to walk together in JourneyTracker.</p>
    <div class="code" id="code">&nbsp;</div>
    <noscript>
      <p class="hint">Your invite code is the last part of the link you tapped — the letters and numbers after <strong>/i/</strong>. Enter it in the app under Friends.</p>
    </noscript>
    <p class="hint" id="jshint" hidden>Enter this code in the JourneyTracker app under Friends.</p>
    <p class="get"><a href="/journeytracker/">Get the app&nbsp;→</a></p>
  </div>

  <div id="notfound">
    <p class="context">That page doesn't exist.</p>
    <p><a href="/">wjamm.com home</a> · <a href="/journeytracker/">JourneyTracker</a></p>
  </div>
</main>
<script>
(function () {
  var m = location.pathname.match(/^\/i\/([^\/]{1,32})\/?$/);
  var invite = document.getElementById('invite');
  var notfound = document.getElementById('notfound');
  if (m) {
    var code = decodeURIComponent(m[1]);
    document.getElementById('code').textContent = code;
    document.getElementById('jshint').hidden = false;
  } else {
    invite.style.display = 'none';
    notfound.style.display = 'block';
    document.title = 'Page not found — W Jamm';
  }
})();
</script>
</body>
</html>
